  <body>
    <div id="root"></div>
    <script>
      // 預先產生的頁面會比 JavaScript 先出現，React 接手前先讓手機選單按鈕可以開關
      document.addEventListener('click', function (e) {
        if (window.__navbarReady || !e.target.closest) return
        var btn = e.target.closest('.navbar__toggle')
        var menu = document.getElementById('mobile-menu')
        if (!btn || !menu) return
        var open = menu.hidden
        menu.hidden = !open
        btn.closest('.navbar').classList.toggle('navbar--open', open)
        btn.setAttribute('aria-expanded', String(open))
        document.body.style.overflow = open ? 'hidden' : ''
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
