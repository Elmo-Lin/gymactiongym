spring.application.name=backend

# Cloud Run 會注入 PORT
server.port=${PORT:8080}

# Firestore 所在的 GCP / Firebase 專案
gcp.project-id=${GCP_PROJECT_ID:gymactiongym}

# 本機開發預設連 Firestore 模擬器（./firestore-emulator.sh）；雲端改用 cloud profile，見 application-cloud.properties
app.firestore.emulator-host=127.0.0.1:8085

# 可以登入教練後台的 Google 帳號（逗號分隔）。沒設定時任何人都無法使用後台。
# 上線時設定在 Cloud Run 的環境變數 ADMIN_EMAILS；本機開發寫在 local.properties（見下方）
app.admin.emails=${ADMIN_EMAILS:}

# 開放教練後台、不檢查登入（前端 config.js 的 adminLogin 為 'none' 時要打開）。
# 打開後任何知道網址的人都能讀寫學生資料；上線時設定在 Cloud Run 的環境變數 ADMIN_OPEN，本機寫在 local.properties
app.admin.open=${ADMIN_OPEN:false}

# 只在本機使用、不 commit 的設定（例如自己的 Gmail）。檔案不存在時直接略過
spring.config.import=optional:classpath:local.properties

# 允許呼叫 API 的前端網址（逗號分隔）
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://gymactiongym.web.app,https://gymactiongym.firebaseapp.com}
